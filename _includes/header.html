<header class="site-header">
    <nav class="navbar">
        <div class="container">
            <a href="{{ '/' | relative_url }}" class="nav-brand">{{ site.title }}</a>
            <ul class="nav-menu">
                {% for item in site.nav %}
                <li>
                    <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="active"{% endif %}>
                        {{ item.title }}
                    </a>
                </li>
                {% endfor %}
            </ul>
            <button class="mobile-menu-toggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>
</header>
