---
layout: default
title: Home
---

<section class="hero">
    <div class="container">
        <div class="hero-content">
            <img src="{{ '/resources/profile_pict.png' | relative_url }}" alt="{{ site.title }}" class="profile-picture">
            <h1 class="hero-title">{{ site.first_name }} {{ site.last_name }}</h1>
            <p class="hero-subtitle">{{ site.tagline }}</p>
            <p class="hero-description">
                {{ site.description }}
            </p>
        </div>
    </div>
</section>
